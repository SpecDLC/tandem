name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install ajv outside the tree
        run: npm install --prefix "$RUNNER_TEMP/deps" ajv@8
      - name: Card membership, schema, openings
        run: NODE_PATH="$RUNNER_TEMP/deps/node_modules" node scripts/check.mjs
      - name: Sync script is idempotent
        run: |
          echo '{"events":[{"id":"a"},{"id":"b"}],"cursor":"b"}' > r.json
          node scripts/sync-jsonl.mjs "$RUNNER_TEMP/e.jsonl" < r.json
          node scripts/sync-jsonl.mjs "$RUNNER_TEMP/e.jsonl" < r.json | grep -q 'appended 0, skipped 2'
          rm r.json
